name: Check sources

# Every Monday, re-verify the charity records, every link on the page, the evidence phrases on
# those pages, and the review dates. A failed run means something changed, broke or went stale:
# read the log, then see README.md.
on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python check.py
