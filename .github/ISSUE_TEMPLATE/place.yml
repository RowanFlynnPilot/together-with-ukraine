name: Suggest a place · Запропонувати заклад
description: A Ukrainian restaurant, bakery, deli or market in the United States.
title: "Place: "
labels: [place]
body:
  - type: markdown
    attributes:
      value: |
        A place is listed if its own website or the press says it serves Ukrainian food, sells Ukrainian goods, or is owned by Ukrainians. "Eastern European" alone is not enough.
        Заклад потрапляє до списку, якщо його сайт або преса зазначає, що він пропонує українську їжу, продає українські товари або належить українцям.
  - type: input
    id: name
    attributes:
      label: Name and address · Назва та адреса
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Its website, if it has one · Сайт закладу, якщо є
  - type: textarea
    id: evidence
    attributes:
      label: Where it says so · Де про це сказано
      description: A link to the page on its own site, or to a news article, and the words it uses.
    validations:
      required: true
